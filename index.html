<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的工作记录</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#253044}.app{max-width:1180px;margin:auto;padding:28px}
button,input,textarea,select{font:inherit}.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:20px 0}.tab,.btn{border:1px solid #dfe3e8;background:#fff;padding:13px;border-radius:12px;cursor:pointer}.tab.active,.primary{background:#253044;color:#fff;border-color:#253044}.panel{display:none}.panel.active{display:block}.card{background:#fff;border:1px solid #e4e7eb;border-radius:16px;padding:18px;margin-bottom:14px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}input,textarea,select{border:1px solid #d9dde5;border-radius:10px;padding:10px}input[type=text],textarea{width:100%}textarea{min-height:90px}.item{padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border:0}.title{font-weight:700}.meta{font-size:13px;color:#7d8797;margin-top:4px}.note{white-space:pre-wrap;margin-top:7px;line-height:1.5}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.danger{border:0;background:transparent;color:#b34b4b;cursor:pointer}.done .title{color:#253044}.badge{font-size:12px;background:#eef1f5;padding:4px 8px;border-radius:20px}.empty{color:#999;padding:18px;text-align:center}.weekly{display:none;gap:7px;flex-wrap:wrap;align-items:center}
@media(max-width:800px){.tabs{grid-template-columns:1fr 1fr}.app{padding:15px}}

/* Shin-chan cute work-book theme */

body{background:linear-gradient(135deg,#fff8e8 0%,#fff2e8 45%,#fffbed 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(#f5c84b 1.4px,transparent 1.4px);background-size:26px 26px}

.tabs:before{content:"Lynn's Work Book";position:absolute;top:108px;left:0;right:0;text-align:center;font-weight:900;font-size:20px;color:#563525}
.tab{text-align:left;font-weight:800;font-size:15px;border:1.5px solid rgba(214,172,100,.35);padding:14px 16px;border-radius:18px;box-shadow:0 5px 12px rgba(116,76,42,.06);color:#52382c;transition:.15s transform,.15s box-shadow}
.tab:nth-child(1){background:#fff0b9}.tab:nth-child(2){background:#ffe0df}.tab:nth-child(3){background:#dff2ff}.tab:nth-child(4){background:#eee6ff}.tab:nth-child(5){background:#dff4df}.tab:nth-child(6){background:#fff0c9}.tab:nth-child(7){background:#ffe2df}
.tab:hover{transform:translateY(-1px);box-shadow:0 8px 16px rgba(116,76,42,.10)}.tab.active{background:#ffd86b;color:#4b2f25;border-color:#efb940;box-shadow:0 8px 18px rgba(231,173,52,.22)}
.panel{margin-left:280px;margin-top:22px}.panel.active{display:block}
.card{background:rgba(255,253,247,.94);border:1.5px solid var(--line);border-radius:22px;padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h3{margin-top:0;color:#593723;font-size:19px}.card h3:after{content:" ✨";font-size:14px}
input,textarea,select{background:#fff;border:1.5px solid #eadcc7;border-radius:13px;padding:11px 13px;outline:none;color:#4b352b;transition:.15s}
input:focus,textarea:focus,select:focus{border-color:#f2b84b;box-shadow:0 0 0 3px rgba(255,210,103,.22)}
textarea{min-height:92px}
.btn{border:1px solid #ead6b6;background:#fff8e8;color:#5c4234;border-radius:12px;padding:9px 13px;font-weight:700;box-shadow:none}
.primary{background:linear-gradient(135deg,#ff8e97,#ff7384);color:#fff;border-color:#ff7384;box-shadow:0 5px 12px rgba(255,115,132,.20)}
.danger{background:#fff0ef;color:#d85a5a;border-radius:10px;padding:8px 11px;font-weight:700}
.item{padding:13px 4px;border-bottom:1px dashed #eadcc7}.title{font-weight:800;color:#4c3328}.meta{color:#9b7f6b}.note{color:#685247}
.badge{background:#fff0b9;color:#7a5525;border:1px solid #f3d78c}
.empty{background:#fffaf0;border:1px dashed #edcf9a;border-radius:15px;color:#a1846c}
.weekly label{background:#fff7df;border:1px solid #f0d79f;border-radius:10px;padding:7px 9px}
#workmaster .card:first-child{background:linear-gradient(135deg,#fff8d9,#fffdf5)}
#todo .card{background:linear-gradient(135deg,#fffdf7,#fff6f0)}
#dates .card:first-child{background:linear-gradient(135deg,#eaf7ff,#fff)}
#email .card:first-child{background:linear-gradient(135deg,#f3edff,#fff)}
#address .card:first-child{background:linear-gradient(135deg,#ebf8ea,#fff)}
#notes .card:first-child{background:linear-gradient(135deg,#fff4d7,#fff)}
#backup .card{background:linear-gradient(135deg,#ffeceb,#fffaf6)}
input[type=checkbox]{accent-color:#ff7d8c;transform:scale(1.15)}
@media(max-width:900px){.app{padding:16px}.app>h1,.app>.meta,.panel{margin-left:0}.tabs{position:relative;left:auto;top:auto;width:auto;padding-top:0;background-image:none;display:grid;grid-template-columns:1fr 1fr;margin:18px 0}.tabs:before{display:none}.tab{text-align:center}}
</style></head><body><div class="app"><h1>我的工作记录</h1><div class="meta">小新陪你把今天的工作一件一件完成 ♡</div>
<div class="tabs"><button class="tab active" data-p="workmaster">🗂️ 工作列表</button><button class="tab" data-p="todo">📋 今日工作</button><button class="tab" data-p="dates">📅 重要日期</button><button class="tab" data-p="email">📧 Email Memo</button><button class="tab" data-p="address">📇 Email Address</button><button class="tab" data-p="notes">📝 备忘录</button><button class="tab" data-p="backup">💾 资料备份</button></div>
<section id="workmaster" class="panel active">
<div class="card"><h3>＋ 新增工作项目</h3><p class="meta">先把经常要做的工作存进「我的工作列表」，需要做时按「加入今日工作」。</p><input id="wt" type="text" placeholder="例如：开发票"><textarea id="wn" placeholder="备注（可不填）"></textarea><div class="row"><select id="wtype" onchange="sched()"><option value="once">普通工作</option><option value="weekly">每周固定</option><option value="monthly">每月固定一次</option></select><div id="once" style="display:none"><input id="wdate" type="date"></div><div id="weekly" class="weekly"><label><input class="wd" type="checkbox" value="1"> 一</label><label><input class="wd" type="checkbox" value="2"> 二</label><label><input class="wd" type="checkbox" value="3"> 三</label><label><input class="wd" type="checkbox" value="4"> 四</label><label><input class="wd" type="checkbox" value="5"> 五</label><label><input class="wd" type="checkbox" value="6"> 六</label><label><input class="wd" type="checkbox" value="0"> 日</label><button class="btn" onclick="weekdays()">一键选工作日（一至五）</button></div><div id="monthly" class="weekly"><label>每月几号：</label><select id="monthDay"><option value="1">1号</option><option value="2">2号</option><option value="3">3号</option><option value="4">4号</option><option value="5">5号</option><option value="6">6号</option><option value="7">7号</option><option value="8">8号</option><option value="9">9号</option><option value="10">10号</option><option value="11">11号</option><option value="12">12号</option><option value="13">13号</option><option value="14">14号</option><option value="15">15号</option><option value="16">16号</option><option value="17">17号</option><option value="18">18号</option><option value="19">19号</option><option value="20">20号</option><option value="21">21号</option><option value="22">22号</option><option value="23">23号</option><option value="24">24号</option><option value="25">25号</option><option value="26">26号</option><option value="27">27号</option><option value="28">28号</option><option value="29">29号</option><option value="30">30号</option><option value="31">31号</option></select></div><button class="btn primary" onclick="addWork()">保存到工作列表</button></div></div>
<div class="card"><h3>🗂️ 我的工作列表</h3><div id="masterList"></div></div>

</section>
<section id="todo" class="panel">
<div class="card"><h3>📋 今日工作</h3><div id="workList"></div></div>
</section>
<section id="dates" class="panel"><div class="card"><h3>新增重要日期</h3><div class="row"><input id="dt" type="text" placeholder="例如：Month End Closing" style="flex:1"><input id="dd" type="date"><select id="dtype"><option>Closing</option><option>Follow-up</option><option>Meeting</option><option>其他</option></select><button class="btn primary" onclick="addDate()">新增</button></div></div><div class="card" id="dateList"></div></section>
<section id="email" class="panel"><div class="card"><h3>📧 Email Memo</h3><input id="es" type="text" placeholder="🔍 搜索标题或内容" oninput="render()"><br><br><input id="et" type="text" placeholder="标题，例如：Payment Reminder"><textarea id="eb" placeholder="Email 内容…"></textarea><button class="btn primary" onclick="saveEmail()">保存 Email Memo</button></div><div id="emailList"></div></section>
<section id="address" class="panel"><div class="card"><h3>📇 Email Address</h3><input id="as" type="text" placeholder="🔍 搜索公司、Billing Email、SOA Email 或备注" oninput="render()"><br><br><input id="ac" type="text" placeholder="公司名字"><input id="ab" type="text" placeholder="Billing Email" style="margin-top:10px"><input id="aso" type="text" placeholder="SOA Email" style="margin-top:10px"><textarea id="an" placeholder="备注"></textarea><button class="btn primary" onclick="saveAddress()">保存 Email Address</button></div><div id="addressList"></div></section><section id="notes" class="panel"><div class="card"><h3>📝 新增备忘录</h3><input id="nt" type="text" placeholder="标题"><textarea id="nb" placeholder="内容…"></textarea><button class="btn primary" onclick="addNote()">保存</button></div><div id="noteList"></div></section>
<section id="backup" class="panel"><div class="card"><h3>💾 资料备份</h3><p>备份包含待办、重要日期、Email Memo 和备忘录。</p><div class="row"><button class="btn primary" onclick="exp()">📤 导出备份</button><button class="btn" onclick="imp.click()">📥 导入恢复</button><input id="imp" type="file" accept=".json" style="display:none" onchange="importData(event)"></div></div></section>
</div><script>
const K='workApp_v2';let d=JSON.parse(localStorage.getItem(K)||'null')||{works:[],dates:[],emails:[],addresses:[],notes:[]};['works','dates','emails','addresses','notes'].forEach(k=>d[k]=d[k]||[]);d.works.forEach(x=>{x.activeDates=x.activeDates||[];x.completed=x.completed||x.completedDates||[];x.days=x.days||x.weekdays||[]});
const $=x=>document.getElementById(x),esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function ld(x=new Date()){return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`} function save(){localStorage.setItem(K,JSON.stringify(d));render()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.p).classList.add('active')});
function sched(){let type=wtype.value;once.style.display='none';weekly.style.display=type==='weekly'?'flex':'none';monthly.style.display=type==='monthly'?'flex':'none'}function weekdays(){document.querySelectorAll('.wd').forEach(x=>x.checked=['1','2','3','4','5'].includes(x.value))}
function addWork(){
 let t=wt.value.trim(),type=wtype.value,days=[...document.querySelectorAll('.wd:checked')].map(x=>+x.value);
 if(!t)return alert('请填写工作内容');
 if(type==='weekly'&&!days.length)return alert('请选择星期');
 d.works.push({id:Date.now(),title:t,notes:wn.value.trim(),type,days,monthDay:type==='monthly'?Number(monthDay.value):null,activeDates:[],completed:[]});
 wt.value='';wn.value='';document.querySelectorAll('.wd').forEach(x=>x.checked=false);save()
}
function workActive(x,t=ld()){
  let z=new Date(t+'T12:00:00');return (x.activeDates||[]).includes(t)||(x.type==='weekly'&&x.days.includes(z.getDay()))||(x.type==='monthly'&&Number(x.monthDay)===z.getDate());
}
function isDone(x,t=ld()){return (x.completed||[]).includes(t)}
function addToday(id){
 let x=d.works.find(a=>a.id===id);if(!x)return;
 x.activeDates=x.activeDates||[];if(!x.activeDates.includes(ld()))x.activeDates.push(ld());save()
}
function toggle(id){
 let x=d.works.find(a=>a.id===id);if(!x)return;let t=ld();x.completed=x.completed||[];
 if(x.completed.includes(t)){
   x.completed=x.completed.filter(a=>a!==t);
 }else{
   x.completed.push(t);
 }
 save()
}
function cancelToday(id){
 let x=d.works.find(a=>a.id===id);if(!x)return;let t=ld();
 x.completed=(x.completed||[]).filter(a=>a!==t);
 if(!(x.activeDates||[]).includes(t)){x.activeDates=x.activeDates||[];x.activeDates.push(t)}
 save()
}
function tomorrow(id){
 let x=d.works.find(a=>a.id===id);if(!x)return;let t=ld(),z=new Date(t+'T12:00:00');z.setDate(z.getDate()+1);let tm=ld(z);
 x.activeDates=x.activeDates||[];x.activeDates=x.activeDates.filter(a=>a!==t);if(!x.activeDates.includes(tm))x.activeDates.push(tm);
 x.completed=(x.completed||[]).filter(a=>a!==t);save()
}
function delW(id){if(confirm('确定删除这项工作吗？')){d.works=d.works.filter(x=>x.id!==id);save()}}
function addDate(){if(!dt.value.trim()||!dd.value)return alert('请填写名称和日期');d.dates.push({id:Date.now(),title:dt.value.trim(),date:dd.value,type:dtype.value});dt.value='';dd.value='';save()}function delD(id){if(confirm('确定删除吗？')){d.dates=d.dates.filter(x=>x.id!==id);save()}}
let ee=null;function saveEmail(){if(!et.value.trim()&&!eb.value.trim())return;if(ee){let x=d.emails.find(a=>a.id===ee);x.title=et.value.trim()||'未命名 Email';x.body=eb.value.trim()}else d.emails.unshift({id:Date.now(),title:et.value.trim()||'未命名 Email',body:eb.value.trim()});ee=null;et.value='';eb.value='';save()}function editE(id){let x=d.emails.find(a=>a.id===id);ee=id;et.value=x.title;eb.value=x.body}function delE(id){if(confirm('确定删除这个 Email Memo 吗？')){d.emails=d.emails.filter(x=>x.id!==id);save()}}async function copyE(id){let x=d.emails.find(a=>a.id===id);await navigator.clipboard.writeText(x.body);alert('已复制')}
let ae=null;
function saveAddress(){let company=ac.value.trim(),billing=ab.value.trim(),soa=aso.value.trim(),note=an.value.trim();if(!company&&!billing&&!soa)return alert('请填写公司名字或 Email');if(ae){let x=d.addresses.find(a=>a.id===ae);if(x)Object.assign(x,{company,billing,soa,note})}else d.addresses.unshift({id:Date.now(),company,billing,soa,note});ae=null;ac.value='';ab.value='';aso.value='';an.value='';save()}
function editA(id){let x=d.addresses.find(a=>a.id===id);if(!x)return;ae=id;ac.value=x.company||'';ab.value=x.billing||'';aso.value=x.soa||'';an.value=x.note||''}
function delA(id){if(confirm('确定删除这个 Email Address 吗？')){d.addresses=d.addresses.filter(x=>x.id!==id);save()}}
async function copyA(id,kind){let x=d.addresses.find(a=>a.id===id);if(!x)return;let v=kind==='billing'?x.billing:x.soa;try{await navigator.clipboard.writeText(v);alert('已复制')}catch(e){let t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('已复制')}}
function addNote(){if(!nt.value.trim()&&!nb.value.trim())return;d.notes.unshift({id:Date.now(),title:nt.value.trim()||'未命名',body:nb.value.trim()});nt.value='';nb.value='';save()}function delN(id){if(confirm('确定删除吗？')){d.notes=d.notes.filter(x=>x.id!==id);save()}}
function exp(){
  let a=document.createElement('a');
  let u=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));
  a.href=u;a.download='工作App备份_'+ld()+'.json';a.click();URL.revokeObjectURL(u);
}
function importData(e){
  let f=e.target.files[0];
  if(!f)return;
  let r=new FileReader();
  r.onload=()=>{
    try{
      let x=JSON.parse(r.result);
      if(confirm('导入会替换目前资料，确定吗？')){
        d=x;
        ['works','dates','emails','addresses','notes'].forEach(k=>d[k]=d[k]||[]);
        d.works.forEach(x=>{x.activeDates=x.activeDates||[];x.completed=x.completed||[];x.days=x.days||[]});
        save();
      }
    }catch(err){alert('备份文件无法读取')}
    e.target.value='';
  };
  r.readAsText(f);
}
function render(){
 let t=ld(),now=new Date(t+'T12:00:00'),dow=now.getDay(),names=['日','一','二','三','四','五','六'];
 let yd=new Date(now);yd.setDate(yd.getDate()-1);let y=ld(yd),ydow=yd.getDay();

 // Automatically carry all unfinished work from yesterday into today.
 d.works.forEach(x=>{
   x.activeDates=x.activeDates||[];x.completed=x.completed||[];
   let wasYesterday=(x.activeDates.includes(y)||(x.type==='weekly'&&x.days.includes(ydow))||(x.type==='monthly'&&Number(x.monthDay)===yd.getDate()));
   if(wasYesterday&&!x.completed.includes(y)&&!x.activeDates.includes(t))x.activeDates.push(t);
 });
 localStorage.setItem(K,JSON.stringify(d));

 masterList.innerHTML=d.works.length?d.works.map(x=>`<div class="item"><div class="title">${esc(x.title)}</div>${x.type==='weekly'?`<div class="meta">每周固定：${x.days.map(v=>names[v]).join('・')}</div>`:x.type==='monthly'?`<div class="meta">每月固定：${x.monthDay}号</div>`:'<div class="meta">普通工作</div>'}${x.notes?`<div class="note">${esc(x.notes)}</div>`:''}<div class="actions"><button class="btn primary" onclick="addToday(${x.id})">＋ 加入今日工作</button><button class="danger" onclick="delW(${x.id})">删除</button></div></div>`).join(''):'<div class="empty">还没有保存工作项目</div>';

 let a=d.works.filter(x=>workActive(x,t));
 let p=a.filter(x=>!isDone(x,t)),q=a.filter(x=>isDone(x,t));
 let yesterdayPending=d.works.filter(x=>{
   let was=(x.activeDates||[]).includes(y)||(x.type==='weekly'&&x.days.includes(ydow))||(x.type==='monthly'&&Number(x.monthDay)===yd.getDate());
   return was&&!isDone(x,y);
 });

 let pendingCard=x=>`<div class="item"><label><input type="checkbox" onchange="toggle(${x.id})"> <span class="title">${esc(x.title)}</span></label>${x.notes?`<div class="note">${esc(x.notes)}</div>`:''}<div class="actions"><button class="btn" onclick="tomorrow(${x.id})">明天再做</button></div></div>`;
 let doneCard=x=>`<div class="item"><label><input type="checkbox" checked onchange="cancelToday(${x.id})"> <span class="title">${esc(x.title)}</span></label>${x.notes?`<div class="note">${esc(x.notes)}</div>`:''}<div class="actions"><button class="btn" onclick="cancelToday(${x.id})">↩ 取消完成</button></div></div>`;

 workList.innerHTML=
 `<div class="meta">${t} 星期${names[dow]}</div>
  ${yesterdayPending.length?`<div style="margin-top:14px;padding:12px;background:#fff7e8;border-radius:12px"><b>⏰ 昨天未完成 ${yesterdayPending.length}</b><div class="meta" style="margin-top:4px">已自动带到今天的未完成工作</div>${yesterdayPending.map(x=>`<div style="padding-top:7px">• ${esc(x.title)}</div>`).join('')}</div>`:''}
  <h3>未完成 <span class="badge">${p.length}</span></h3>
  ${p.map(pendingCard).join('')||'<div class="empty">今天没有未完成工作 🎉</div>'}
  <h3>已完成 ✅ <span class="badge">${q.length}</span></h3>
  ${q.map(doneCard).join('')||'<div class="empty">还没有完成项目</div>'}`;

 dateList.innerHTML=d.dates.sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<div class="item"><b>${esc(x.title)}</b> <span class="badge">${esc(x.type)}</span><div class="meta">${x.date}</div><button class="danger" onclick="delD(${x.id})">删除</button></div>`).join('')||'<div class="empty">还没有重要日期</div>';
 let z=(es?.value||'').toLowerCase(),em=d.emails.filter(x=>!z||(x.title+' '+x.body).toLowerCase().includes(z));emailList.innerHTML=em.map(x=>`<div class="card"><b>${esc(x.title)}</b><div class="note">${esc(x.body)}</div><div class="actions"><button class="btn" onclick="copyE(${x.id})">📋 Copy</button><button class="btn" onclick="editE(${x.id})">✏️ Edit</button><button class="danger" onclick="delE(${x.id})">🗑️ Delete</button></div></div>`).join('')||'<div class="card empty">还没有 Email Memo</div>';let aq=(as?.value||'').trim().toLowerCase();let adr=d.addresses.filter(x=>!aq||[x.company,x.billing,x.soa,x.note].join(' ').toLowerCase().includes(aq));addressList.innerHTML=adr.length?adr.map(x=>`<div class="card"><div class="title">${esc(x.company||'未填写公司')}</div>${x.billing?`<div class="item"><b>Billing Email</b><div class="note">${esc(x.billing)}</div><button class="btn" onclick="copyA(${x.id},'billing')">📋 Copy</button></div>`:''}${x.soa?`<div class="item"><b>SOA Email</b><div class="note">${esc(x.soa)}</div><button class="btn" onclick="copyA(${x.id},'soa')">📋 Copy</button></div>`:''}${x.note?`<div class="note"><b>备注：</b>${esc(x.note)}</div>`:''}<div class="actions"><button class="btn" onclick="editA(${x.id})">✏️ Edit</button><button class="danger" onclick="delA(${x.id})">🗑️ Delete</button></div></div>`).join(''):'<div class="card empty">还没有 Email Address</div>';noteList.innerHTML=d.notes.map(x=>`<div class="card"><b>${esc(x.title)}</b><div class="note">${esc(x.body)}</div><button class="danger" onclick="delN(${x.id})">删除</button></div>`).join('')||'<div class="card empty">还没有备忘录</div>'}
wdate.value=ld();sched();render();
</script></body></html>
