<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的工作记录</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#253044}
button,input,textarea,select{font:inherit}.app{max-width:1180px;margin:auto;padding:28px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
h1{font-size:28px;margin:0}.sub{color:#778196;margin-top:6px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.tab{border:1px solid #e3e6eb;background:#fff;padding:16px;border-radius:14px;cursor:pointer;font-weight:700;font-size:16px}
.tab.active{background:#253044;color:#fff}.panel{display:none}.panel.active{display:block}
.card{background:#fff;border:1px solid #e5e8ed;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 16px #00000008}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input,select,textarea{border:1px solid #d9dde5;border-radius:10px;padding:11px 12px;background:#fff}
input[type=text]{flex:1;min-width:240px} textarea{width:100%;min-height:120px;resize:vertical}
.primary{border:0;background:#253044;color:white;border-radius:10px;padding:11px 18px;cursor:pointer}
.secondary{border:1px solid #d9dde5;background:#fff;border-radius:10px;padding:10px 15px;cursor:pointer}
.danger{border:0;background:transparent;color:#b34b4b;cursor:pointer}
.item{display:flex;align-items:flex-start;gap:12px;padding:13px 4px;border-bottom:1px solid #eef0f3}
.item:last-child{border-bottom:0}.grow{flex:1}.done .title{text-decoration:line-through;color:#9aa1ad}
.meta{font-size:13px;color:#8991a0;margin-top:4px}.title{font-weight:700}
.badge{font-size:12px;background:#eef1f5;padding:4px 8px;border-radius:20px}
.note{white-space:pre-wrap;line-height:1.55}.empty{color:#9aa1ad;text-align:center;padding:25px}
.actions{display:flex;gap:5px}.backup{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.file{display:none}
@media(max-width:700px){.app{padding:16px}.tabs{grid-template-columns:1fr 1fr}.backup{grid-template-columns:1fr}h1{font-size:24px}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>💼 我的工作记录</h1><div class="sub">待办 · 重要日期 · 备忘录 · 资料备份</div></div></header>
<div class="tabs">
<button class="tab active" data-page="todo">📋 待办事项</button>
<button class="tab" data-page="dates">📅 重要日期</button>
<button class="tab" data-page="notes">📝 备忘录</button>
<button class="tab" data-page="backup">💾 资料备份</button>
</div>

<section id="todo" class="panel active">
<div class="card"><h3>新增待办</h3><div class="row">
<input id="todoText" type="text" placeholder="例如：Follow up customer payment">
<select id="todoGroup"><option>今天</option><option>本周</option></select>
<button class="primary" onclick="addTodo()">＋ 新增</button></div></div>
<div class="card"><div id="todoList"></div></div>
</section>

<section id="dates" class="panel">
<div class="card"><h3>新增重要日期</h3><div class="row">
<input id="dateTitle" type="text" placeholder="例如：Month End Closing">
<input id="dateValue" type="date">
<select id="dateType"><option>Closing</option><option>Follow-up</option><option>其他</option></select>
<button class="primary" onclick="addDate()">＋ 新增</button></div></div>
<div class="card"><div id="dateList"></div></div>
</section>

<section id="notes" class="panel">
<div class="card"><h3>新增备忘录</h3>
<input id="noteTitle" type="text" placeholder="标题" style="width:100%;margin-bottom:10px">
<textarea id="noteText" placeholder="输入临时工作记录…"></textarea>
<div style="margin-top:10px"><button class="primary" onclick="addNote()">＋ 保存备忘录</button></div></div>
<div id="noteList"></div>
</section>

<section id="backup" class="panel">
<div class="backup">
<div class="card"><h3>📤 导出备份</h3><p>把待办事项、重要日期和备忘录全部保存成一个备份文件。</p><button class="primary" onclick="exportBackup()">导出备份</button><div class="meta" id="lastExport"></div></div>
<div class="card"><h3>📥 导入恢复</h3><p>选择之前导出的备份文件恢复资料。</p><button class="secondary" onclick="document.getElementById('importFile').click()">选择备份文件</button><input class="file" id="importFile" type="file" accept=".json,application/json" onchange="importBackup(event)"></div>
</div>
</section>
</div>
<script>
const KEY='workRecordApp_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{todos:[],dates:[],notes:[],lastExport:''};
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.page).classList.add('active')});
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function addTodo(){let t=todoText.value.trim();if(!t)return;data.todos.unshift({id:Date.now(),text:t,group:todoGroup.value,done:false});todoText.value='';save()}
function toggleTodo(id){let x=data.todos.find(x=>x.id===id);if(x){x.done=!x.done;save()}}
function delTodo(id){if(confirm('确认删除这项待办事项吗？')){data.todos=data.todos.filter(x=>x.id!==id);save()}}
function addDate(){let t=dateTitle.value.trim(),d=dateValue.value;if(!t||!d)return alert('请填写名称和日期。');data.dates.push({id:Date.now(),title:t,date:d,type:dateType.value});dateTitle.value='';dateValue.value='';save()}
function delDate(id){if(confirm('确认删除这个重要日期吗？')){data.dates=data.dates.filter(x=>x.id!==id);save()}}
function dayText(s){let a=new Date(s+'T00:00:00'),b=new Date();b.setHours(0,0,0,0);let n=Math.round((a-b)/86400000);return n===0?'今天':n>0?'还有 '+n+' 天':'已过 '+Math.abs(n)+' 天'}
function addNote(){let t=noteTitle.value.trim(),n=noteText.value.trim();if(!t&&!n)return;data.notes.unshift({id:Date.now(),title:t||'未命名备忘录',text:n,updated:new Date().toLocaleString()});noteTitle.value='';noteText.value='';save()}
function editNote(id){let x=data.notes.find(x=>x.id===id);let n=prompt('编辑备忘录内容：',x.text);if(n!==null){x.text=n;x.updated=new Date().toLocaleString();save()}}
function delNote(id){if(confirm('确认删除这个备忘录吗？')){data.notes=data.notes.filter(x=>x.id!==id);save()}}
function exportBackup(){data.lastExport=new Date().toLocaleString();localStorage.setItem(KEY,JSON.stringify(data));let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='工作记录备份_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);render()}
function importBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.todos||!x.dates||!x.notes)throw 0;if(confirm('导入会以备份资料替换目前资料，确认继续吗？')){data=x;save();alert('资料恢复完成。')}}catch(_){alert('这个备份文件无法读取。')}e.target.value=''};r.readAsText(f)}
function render(){
todoList.innerHTML=data.todos.length?data.todos.map(x=>`<div class="item ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} onchange="toggleTodo(${x.id})"><div class="grow"><div class="title">${esc(x.text)}</div><div class="meta">${esc(x.group)}</div></div><button class="danger" onclick="delTodo(${x.id})">删除</button></div>`).join(''):'<div class="empty">还没有待办事项</div>';
let ds=[...data.dates].sort((a,b)=>a.date.localeCompare(b.date));dateList.innerHTML=ds.length?ds.map(x=>`<div class="item"><div class="grow"><div class="title">${esc(x.title)} <span class="badge">${esc(x.type)}</span></div><div class="meta">${x.date} · ${dayText(x.date)}</div></div><button class="danger" onclick="delDate(${x.id})">删除</button></div>`).join(''):'<div class="empty">还没有重要日期</div>';
noteList.innerHTML=data.notes.length?data.notes.map(x=>`<div class="card"><div class="item"><div class="grow"><div class="title">${esc(x.title)}</div><div class="meta">更新：${esc(x.updated)}</div></div><div class="actions"><button class="secondary" onclick="editNote(${x.id})">编辑</button><button class="danger" onclick="delNote(${x.id})">删除</button></div></div><div class="note" style="padding-top:12px">${esc(x.text)}</div></div>`).join(''):'<div class="card empty">还没有备忘录</div>';
lastExport.textContent=data.lastExport?'上次导出：'+data.lastExport:'尚未导出备份';
}
render();
</script>
</body></html>
