<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的工作记录</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#253044}.app{max-width:1180px;margin:auto;padding:28px}
button,input,textarea,select{font:inherit}.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:20px 0}.tab,.btn{border:1px solid #dfe3e8;background:#fff;padding:13px;border-radius:12px;cursor:pointer}.tab.active,.primary{background:#253044;color:#fff;border-color:#253044}.panel{display:none}.panel.active{display:block}.card{background:#fff;border:1px solid #e4e7eb;border-radius:16px;padding:18px;margin-bottom:14px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}input,textarea,select{border:1px solid #d9dde5;border-radius:10px;padding:10px}input[type=text],textarea{width:100%}textarea{min-height:90px}.item{padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border:0}.title{font-weight:700}.meta{font-size:13px;color:#7d8797;margin-top:4px}.note{white-space:pre-wrap;margin-top:7px;line-height:1.5}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.danger{border:0;background:transparent;color:#b34b4b;cursor:pointer}.done .title{color:#253044}.badge{font-size:12px;background:#eef1f5;padding:4px 8px;border-radius:20px}.empty{color:#999;padding:18px;text-align:center}.weekly{display:none;gap:7px;flex-wrap:wrap;align-items:center}
@media(max-width:800px){.tabs{grid-template-columns:1fr 1fr}.app{padding:15px}}
</style><style id="left-nav-layout">
@media (min-width:801px){
.app{max-width:1180px;margin:auto;padding:28px;display:grid;grid-template-columns:210px minmax(0,1fr);column-gap:22px;align-items:start}
.app>h1,.app>.meta,.app>.tabs{grid-column:1}
.app>h1{font-size:22px;margin:0 0 5px}.app>h1+.meta{margin-bottom:14px}
.tabs{display:flex;flex-direction:column;gap:9px;margin:0;position:sticky;top:18px}
.tab{width:100%;text-align:left;padding:13px 15px}
.panel{grid-column:2;grid-row:1 / span 20;width:100%;min-width:0}
}
@media(max-width:800px){.app{display:block;padding:15px}.tabs{grid-template-columns:1fr 1fr}}
</style>
<style id="v19-today-work-design">
#workList .today-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
#workList .today-date{font-size:13px;color:#7d8797}
#workList .work-section-title{display:flex;align-items:center;gap:7px;margin:18px 0 10px}
#workList .task-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border:1px solid #e7e9ee;border-radius:12px;margin-bottom:9px;background:#fff}
#workList .task-left{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
#workList .task-title{font-weight:700;overflow-wrap:anywhere}
#workList .task-note{font-size:13px;color:#7d8797;margin-top:4px}
#workList .task-action{flex:0 0 auto;padding:7px 10px;border-radius:9px;font-size:13px}
#workList .completed-row{background:#fafafa}
#workList .completed-row .task-title{color:#596273}
#workList .carry-badge{font-size:11px;padding:3px 7px;border-radius:20px;background:#fff1d6;color:#9a6410;white-space:nowrap}
@media(max-width:600px){
 #workList .task-row{padding:11px}
 #workList .task-action{padding:6px 8px}
}
</style>
<style id="shinchan-theme-v21">
:root{--cream:#fff8e8;--paper:#fffdf8;--red:#e84b4b;--yellow:#ffd968;--blue:#9fd9ed;--pink:#f7c6cf;--ink:#3f4148;--line:#eadfce}
body{background:var(--cream);color:var(--ink)}
.card{background:var(--paper);border-color:var(--line);box-shadow:0 3px 10px rgba(91,72,50,.05)}
.tab,.btn{border-color:var(--line);background:#fffdf9}.tab:hover,.btn:hover{background:#fff5d8}
.tab.active,.primary{background:var(--red);color:#fff;border-color:var(--red)}
.badge{background:#fff0b8;color:#735b20}input,textarea,select{background:#fff;border-color:#e6d8c6}
.danger{color:#c64a4a}.app>h1{color:#333}.app>h1::before{content:"👦🏻 ";font-size:.95em}.app>h1::after{content:"  ✏️";font-size:.72em}
.tabs .tab:nth-child(4n+1){border-left:4px solid var(--red)}.tabs .tab:nth-child(4n+2){border-left:4px solid var(--yellow)}
.tabs .tab:nth-child(4n+3){border-left:4px solid var(--blue)}.tabs .tab:nth-child(4n){border-left:4px solid var(--pink)}
.tabs .tab.active{border-left-color:#b72e2e}#workList .task-row{border-color:#eee1d1;background:#fffdf9}
#workList .completed-row{background:#f8f5ef}.nav-drag-hint{font-size:11px;color:#9b8d7d;margin:7px 0 0;text-align:center}
</style><style id="v22-popup-add-forms">
.page-actionbar{margin-bottom:14px}
.add-form-hidden{display:none}
</style>

</style></head><body><div class="app"><h1>Lynn’s Work Book</h1><div class="meta">待办 · 重要日期 · Email Memo · 备忘录 · 资料备份</div>
<div class="tabs"><button class="tab active" data-p="workmaster">工作列表</button><button class="tab" data-p="dates">重要日期</button><button class="tab" data-p="email">Email Memo</button><button class="tab" data-p="address">Email Address</button><button class="tab" data-p="notes">备忘录</button><button class="tab" data-p="backup">资料备份</button></div><div class="nav-drag-hint">↕ 拖动按钮可重新排列</div>
<section id="workmaster" class="panel active">
<div class="row" style="margin-bottom:14px">
  <button class="btn primary" id="showAddWorkBtn" onclick="showWorkBox('add')">＋ 新增工作</button>
  <button class="btn" id="showMasterBtn" onclick="showWorkBox('master')">🗂️ 我的工作列表</button>
</div>

<div class="card" id="addWorkCard" style="display:none">
  <h3>＋ 新增工作</h3>
  <div class="row" style="margin-bottom:14px">
    <label><input type="radio" name="newWorkKind" value="once" checked onchange="newWorkKindChanged()"> 一次性工作</label>
    <label><input type="radio" name="newWorkKind" value="fixed" onchange="newWorkKindChanged()"> 固定工作</label>
  </div>
  <input id="wt" type="text" placeholder="工作名称，例如：Issue invoice">
  <textarea id="wn" placeholder="备注（可不填）"></textarea>

  <div id="onceWorkOptions" style="margin-top:10px">
    <button class="btn primary" onclick="addOneTimeToday()">＋ 加入今日工作</button>
    <div class="meta" style="margin-top:7px">一次性工作只加入今天，不会保存到「我的工作列表」。</div>
  </div>

  <div id="fixedWorkOptions" style="display:none;margin-top:10px">
    <div class="row">
      <select id="wtype" onchange="sched()">
        <option value="weekly">每周固定</option>
        <option value="monthly">每月固定一次</option>
      </select>
      <div id="once" style="display:none"></div>
      <div id="weekly" class="weekly">
        <label><input class="wd" type="checkbox" value="1"> 一</label>
        <label><input class="wd" type="checkbox" value="2"> 二</label>
        <label><input class="wd" type="checkbox" value="3"> 三</label>
        <label><input class="wd" type="checkbox" value="4"> 四</label>
        <label><input class="wd" type="checkbox" value="5"> 五</label>
        <label><input class="wd" type="checkbox" value="6"> 六</label>
        <label><input class="wd" type="checkbox" value="0"> 日</label>
        <button class="btn" onclick="weekdays()">一键选工作日（一至五）</button>
      </div>
      <div id="monthly" class="weekly">
        <label>每月几号：</label>
        <select id="monthDay"><option value="1">1号</option><option value="2">2号</option><option value="3">3号</option><option value="4">4号</option><option value="5">5号</option><option value="6">6号</option><option value="7">7号</option><option value="8">8号</option><option value="9">9号</option><option value="10">10号</option><option value="11">11号</option><option value="12">12号</option><option value="13">13号</option><option value="14">14号</option><option value="15">15号</option><option value="16">16号</option><option value="17">17号</option><option value="18">18号</option><option value="19">19号</option><option value="20">20号</option><option value="21">21号</option><option value="22">22号</option><option value="23">23号</option><option value="24">24号</option><option value="25">25号</option><option value="26">26号</option><option value="27">27号</option><option value="28">28号</option><option value="29">29号</option><option value="30">30号</option><option value="31">31号</option></select>
      </div>
      <button class="btn primary" id="saveFixedBtn" onclick="addWork()">保存到我的工作列表</button>
      <button class="btn" id="cancelEditFixedBtn" style="display:none" onclick="cancelEditFixed()">取消编辑</button>
    </div>
    <div class="meta" style="margin-top:7px">固定工作会保存到「我的工作列表」，并在指定日期自动进入今日工作。</div>
  </div>
</div>

<div class="card" id="masterCard" style="display:none">
  <h3>🗂️ 我的工作列表</h3>
  <div id="masterList"></div>
</div>

<div class="card">
  <div id="workList"></div>
</div>
</section>
<section id="dates" class="panel"><div class="page-actionbar"><button class="btn primary" onclick="togglePageAdd('dateAddCard')">＋ 新增重要日期</button></div><div class="card add-form-hidden" id="dateAddCard"><h3>新增重要日期</h3><div class="row"><input id="dt" type="text" placeholder="例如：Month End Closing" style="flex:1"><input id="dd" type="date"><select id="dtype"><option>Closing</option><option>Follow-up</option><option>Meeting</option><option>其他</option></select><button class="btn primary" onclick="addDate()">新增</button></div></div><div class="card" id="dateList"></div></section>
<section id="email" class="panel"><div class="page-actionbar"><button class="btn primary" onclick="togglePageAdd('emailAddCard')">＋ 新增 Email Memo</button></div><div class="card add-form-hidden" id="emailAddCard"><h3>📧 新增 Email Memo</h3><input id="es" type="text" placeholder="🔍 搜索标题或内容" oninput="render()"><br><br><input id="et" type="text" placeholder="标题，例如：Payment Reminder"><textarea id="eb" placeholder="Email 内容…"></textarea><button class="btn primary" onclick="saveEmail()">保存 Email Memo</button></div><div id="emailList"></div></section>
<section id="address" class="panel"><div class="page-actionbar"><button class="btn primary" onclick="togglePageAdd('addressAddCard')">＋ 新增 Email Address</button></div><div class="card add-form-hidden" id="addressAddCard"><h3>📇 新增 Email Address</h3><input id="as" type="text" placeholder="🔍 搜索公司、Billing Email、SOA Email 或备注" oninput="render()"><br><br><input id="ac" type="text" placeholder="公司名字"><input id="ab" type="text" placeholder="Billing Email" style="margin-top:10px"><input id="aso" type="text" placeholder="SOA Email" style="margin-top:10px"><textarea id="an" placeholder="备注"></textarea><button class="btn primary" onclick="saveAddress()">保存 Email Address</button></div><div id="addressList"></div></section><section id="notes" class="panel"><div class="page-actionbar"><button class="btn primary" onclick="togglePageAdd('noteAddCard')">＋ 新增备忘录</button></div><div class="card add-form-hidden" id="noteAddCard"><h3>📝 新增备忘录</h3><input id="nt" type="text" placeholder="标题"><textarea id="nb" placeholder="内容…"></textarea><button class="btn primary" onclick="addNote()">保存</button></div><div id="noteList"></div></section>
<section id="backup" class="panel"><div class="card"><h3>资料备份</h3><p>备份包含待办、重要日期、Email Memo 和备忘录。</p><div class="row"><button class="btn primary" onclick="exp()">📤 导出备份</button><button class="btn" onclick="imp.click()">📥 导入恢复</button><input id="imp" type="file" accept=".json" style="display:none" onchange="importData(event)"></div></div></section>
</div><script>
const K='workApp_v2';let d=JSON.parse(localStorage.getItem(K)||'null')||{works:[],dates:[],emails:[],addresses:[],notes:[]};['works','dates','emails','addresses','notes'].forEach(k=>d[k]=d[k]||[]);d.works.forEach(x=>{x.activeDates=x.activeDates||[];x.completed=x.completed||x.completedDates||[];x.days=x.days||x.weekdays||[]});
const $=x=>document.getElementById(x),esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function ld(x=new Date()){return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`} function save(){localStorage.setItem(K,JSON.stringify(d));render()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.p).classList.add('active')});
function showWorkBox(which){
 const add=document.getElementById('addWorkCard'), master=document.getElementById('masterCard');
 const ab=document.getElementById('showAddWorkBtn'), mb=document.getElementById('showMasterBtn');
 if(which==='add'){
   const opening=add.style.display==='none';
   add.style.display=opening?'block':'none'; master.style.display='none';
   ab.classList.toggle('primary',opening); mb.classList.remove('primary');
 }else{
   const opening=master.style.display==='none';
   master.style.display=opening?'block':'none'; add.style.display='none';
   mb.classList.toggle('primary',opening); ab.classList.remove('primary');
 }
}
let editingFixedId=null;
function newWorkKindChanged(){
 let kind=document.querySelector('input[name="newWorkKind"]:checked')?.value||'once';
 document.getElementById('onceWorkOptions').style.display=kind==='once'?'block':'none';
 document.getElementById('fixedWorkOptions').style.display=kind==='fixed'?'block':'none';
 if(kind==='fixed')sched();
}
function addOneTimeToday(){
 let title=wt.value.trim(),notes=wn.value.trim();
 if(!title)return alert('请填写工作内容');
 let id=Date.now(),t=ld();
 d.works.push({id,title,notes,type:'once',days:[],monthDay:null,activeDates:[t],completed:[],oneTime:true});
 wt.value='';wn.value='';save();
}
function editFixed(id){
 let x=d.works.find(a=>a.id===id);if(!x)return;
 editingFixedId=id;
 showWorkBox('add');
 document.querySelector('input[name="newWorkKind"][value="fixed"]').checked=true;
 newWorkKindChanged();
 wt.value=x.title||'';wn.value=x.notes||'';
 wtype.value=x.type==='monthly'?'monthly':'weekly';
 document.querySelectorAll('.wd').forEach(c=>c.checked=(x.days||[]).includes(+c.value));
 if(x.monthDay)monthDay.value=String(x.monthDay);
 sched();
 saveFixedBtn.textContent='保存修改';
 cancelEditFixedBtn.style.display='inline-block';
}
function cancelEditFixed(){
 editingFixedId=null;wt.value='';wn.value='';
 document.querySelectorAll('.wd').forEach(c=>c.checked=false);
 saveFixedBtn.textContent='保存到我的工作列表';
 cancelEditFixedBtn.style.display='none';
}
function togglePageAdd(id){
 const el=document.getElementById(id);if(!el)return;
 el.style.display=(el.style.display==='block')?'none':'block';
}
function sched(){let type=wtype.value;once.style.display='none';weekly.style.display=type==='weekly'?'flex':'none';monthly.style.display=type==='monthly'?'flex':'none'}function weekdays(){document.querySelectorAll('.wd').forEach(x=>x.checked=['1','2','3','4','5'].includes(x.value))}
function addWork(){
 let t=wt.value.trim(),type=wtype.value,days=[...document.querySelectorAll('.wd:checked')].map(x=>+x.value);
 if(!t)return alert('请填写工作内容');
 if(type==='weekly'&&!days.length)return alert('请选择星期');
 if(editingFixedId){
   let x=d.works.find(a=>a.id===editingFixedId);
   if(x){x.title=t;x.notes=wn.value.trim();x.type=type;x.days=days;x.monthDay=type==='monthly'?Number(monthDay.value):null;}
 }else{
   d.works.push({id:Date.now(),title:t,notes:wn.value.trim(),type,days,monthDay:type==='monthly'?Number(monthDay.value):null,activeDates:[],completed:[]});
 }
 editingFixedId=null;wt.value='';wn.value='';document.querySelectorAll('.wd').forEach(x=>x.checked=false);
 saveFixedBtn.textContent='保存到我的工作列表';cancelEditFixedBtn.style.display='none';
 save();showWorkBox('master')
}
function workActive(x,t=ld()){
  let z=new Date(t+'T12:00:00');return (x.activeDates||[]).includes(t)||(x.type==='weekly'&&x.days.includes(z.getDay()))||(x.type==='monthly'&&Number(x.monthDay)===z.getDate());
}
function isDone(x,t=ld()){return (x.completed||[]).includes(t)}
function addToday(id){
 let x=d.works.find(a=>a.id===id);if(!x)return;
 x.activeDates=x.activeDates||[];if(!x.activeDates.includes(ld()))x.activeDates.push(ld());save()
}
function toggle(id){
 let x=d.works.find(a=>a.id===id);if(!x)return;let t=ld();x.completed=x.completed||[];
 if(x.completed.includes(t)){
   x.completed=x.completed.filter(a=>a!==t);
 }else{

function initNavDrag(){
 const tabs=document.querySelector('.tabs');if(!tabs)return;
 const key='workApp_navOrder_v1';let saved=[];
 try{saved=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}
 saved.forEach(id=>{let el=tabs.querySelector('.tab[data-p="'+id+'"]');if(el)tabs.appendChild(el)});
 let dragging=null;
 [...tabs.querySelectorAll('.tab')].forEach(btn=>{
   btn.draggable=true;
   btn.addEventListener('dragstart',e=>{dragging=btn;btn.style.opacity='.55';if(e.dataTransfer)e.dataTransfer.effectAllowed='move'});
   btn.addEventListener('dragend',()=>{btn.style.opacity='';dragging=null;localStorage.setItem(key,JSON.stringify([...tabs.querySelectorAll('.tab')].map(x=>x.dataset.p)))});
   btn.addEventListener('dragover',e=>{e.preventDefault();if(!dragging||dragging===btn)return;let r=btn.getBoundingClientRect();tabs.insertBefore(dragging,e.clientY<r.top+r.height/2?btn:btn.nextSibling)});
 });
}
